name: linux with intel

on: [push, pull_request]

jobs:
  # Build with Intel toolchain
  intel-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        fc: [ifx]

    env:
      FC: ${{ matrix.fc }}
      FPM_COMPILER: ifx
      TZ: UTC+04:00
      # Pure-Fortran project: only the Fortran compiler (ifx) is needed.
      APT_PACKAGES: >-
        intel-oneapi-compiler-fortran
        luajit libluajit-5.1-dev

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Add Intel oneAPI apt repository
      run: |
        set -e
        KEY=GPG-PUB-KEY-INTEL-SW-PRODUCTS-2023.PUB
        wget -q "https://apt.repos.intel.com/intel-gpg-keys/${KEY}"
        # Modern, non-deprecated import (apt-key is being removed).
        sudo gpg --dearmor -o /usr/share/keyrings/intel-oneapi.gpg "${KEY}"
        rm -f "${KEY}"
        echo "deb [signed-by=/usr/share/keyrings/intel-oneapi.gpg] https://apt.repos.intel.com/oneapi all main" \
          | sudo tee /etc/apt/sources.list.d/intel-oneapi.list
        sudo apt-get update

    - name: Install Intel oneAPI Fortran compiler (ifx)
      run: |
        set -e
        sudo apt-get install -y -q ${{ env.APT_PACKAGES }}
        # Source the oneAPI environment so ifx is available in this step.
        source /opt/intel/oneapi/setvars.sh

        # Hard-fail here (with a clear message) if the install did not provide
        # ifx, so a packaging problem surfaces at install time, not as a cryptic
        # "command not found" two steps later.
        command -v ifx || { echo "ERROR: ifx not found after setvars.sh"; find /opt/intel/oneapi -maxdepth 3 -name ifx 2>/dev/null; exit 1; }
        ifx --version

        # Persist the compiler for the remaining steps. PATH must be extended via
        # the dedicated GITHUB_PATH channel (setting PATH through GITHUB_ENV, e.g.
        # with `printenv`, is not applied to later steps -- that was the bug).
        # The runtime library path is carried through GITHUB_ENV so ifx and the
        # built test binaries can load the oneAPI runtime.
        BIN="$(dirname "$(command -v ifx)")"
        echo "oneAPI compiler bin: ${BIN}"
        echo "${BIN}" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

    - name: Install fpm
      run: |
        set -e
        command -v ifx   # fail fast with a clear error if ifx is missing from PATH
        wget -q https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0.F90
        mkdir -p /home/runner/.local/bin tmp
        "${FC}" fpm-0.13.0.F90 -Itmp -module tmp -o /home/runner/.local/bin/fpm
        rm -rf fpm-0.13.0.F90 tmp
        # GITHUB_PATH only takes effect for subsequent steps, so check the
        # binary by its full path here and expose the dir for the next step.
        /home/runner/.local/bin/fpm --version
        echo "/home/runner/.local/bin" >> "$GITHUB_PATH"

    - name: Run Intel unit tests
      run: |
        set -e
        command -v ifx
        command -v fpm
        fpm test --profile release --compiler "${FPM_COMPILER}"
      env:
        OMP_NUM_THREADS: 2,1
